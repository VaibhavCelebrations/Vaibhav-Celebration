name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Dummy values so the env schema validates; the unit tests below never touch a real database.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
      JWT_CUSTOMER_ACCESS_SECRET: ci-customer-secret-ci-customer-secret-ci-cust
      REDIS_CACHE_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      # Unit tests that need no database (DB-backed suites are run against a staging DB, not in CI).
      - run: npx vitest run src/integrations src/middleware src/modules/builder src/modules/shop src/lib
      # Fail the build on known-vulnerable runtime dependencies (high+). The Prisma CLI chain
      # (deepmerge-ts) is build/migration-time tooling only and is tracked in the audit report.
      - run: npm audit --omit=dev --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

  # Proves every image builds and the compose file is valid, so a broken Dockerfile is caught on the PR.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: |
          cp deploy/.env.example .env
          sed -i 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/; s/^REVALIDATE_SECRET=$/REVALIDATE_SECRET=ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          touch deploy/env/backend.env
          docker compose -f docker-compose.prod.yml --profile local-db config -q
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.example.com
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1
      - uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1
