include /etc/nginx/snippets/security-headers.conf;
limit_req  zone=site burst=60 nodelay;
limit_conn perip 40;

# Never serve dotfiles (.git, .env ...) - except ACME challenges.
location ~ /\.(?!well-known) { deny all; return 404; }

location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://frontend_upstream;
}

# The browser also talks to the API through the site origin ("/api/v1" rewrite in next.config.ts).
# Route it straight to the API here instead of bouncing through the Next.js server.
location /api/v1/ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}
