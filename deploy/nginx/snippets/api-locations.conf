include /etc/nginx/snippets/security-headers.conf;
limit_conn perip 60;

location ~ /\.(?!well-known) { deny all; return 404; }

# Liveness for uptime monitors / load balancers (minimal JSON, no secrets).
location = /health {
    access_log off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}

# Brute-force / spam targets get a much tighter edge limit (about 6 req/min + burst).
location ~ ^/api/v1/(auth|customer/auth|guest|chatbot/session|consultations|leads)(/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=sensitive burst=10 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}

# Admin media uploads: allow larger bodies (keep in sync with MEDIA_MAX_UPLOAD_MB) and stream them.
location ~ ^/api/v1/admin/media/(upload|upload-binary)$ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=api burst=20 nodelay;
    client_max_body_size 55m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}

# Payment / messaging webhooks: signature-verified by the API; keep the raw body untouched.
location ~ ^/api/v1/(payments/webhook|whatsapp/webhook)$ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_request_buffering off;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend_upstream;
}
