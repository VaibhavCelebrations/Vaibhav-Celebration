# Vaibhav Celebrations - reverse proxy (nginx)
# Rendered server blocks live in /etc/nginx/conf.d (generated from ./templates-* at container start).
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -- Hardening -------------------------------------------------------------
    server_tokens off;                       # do not advertise the nginx version
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    client_max_body_size  1m;                # per-location overrides below (media upload)
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # -- Performance -----------------------------------------------------------
    sendfile   on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout  65s;                  # keep below the Node keepAliveTimeout (65s+) on the apps
    keepalive_requests 1000;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml
               application/rss+xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # -- Real client IP --------------------------------------------------------
    # When another proxy / load balancer sits in front of this nginx (AWS ALB, GCP LB, Cloudflare,
    # Render), trust its X-Forwarded-For - but only from private ranges, never from the open internet.
    # For Cloudflare, additionally include its published ranges (see the deployment guide).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # -- Rate limiting (edge layer; the API has its own Redis-backed limits too) --
    limit_req_zone  $binary_remote_addr zone=site:10m       rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m        rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=sensitive:10m  rate=6r/m;   # login, OTP, lead forms, chatbot saves
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Forward the scheme the client used (an upstream LB may have terminated TLS for us).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format main '$remote_addr - $request_time "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    upstream frontend_upstream { server frontend:3000; keepalive 32; }
    upstream backend_upstream  { server backend:4000;  keepalive 32; }
    upstream admin_upstream    { server admin:3001;    keepalive 16; }

    # Default upstream timeouts (locations may override, e.g. media uploads)
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    include /etc/nginx/conf.d/*.conf;
}
